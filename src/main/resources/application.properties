spring.application.name=springboot-academy-api
server.port=8080

# ---- Default database: local MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3307/springboot_academy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:1234}
spring.h2.console.enabled=false

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Pagination: default size 10 (@PageableDefault), max size 100 (PaginationConfig) ----

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# ---- Sample data (inserted only when the tables are empty) ----
app.seed-data=true
